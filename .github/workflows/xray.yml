name: xray

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact upstream tag to publish (e.g. v26.7.28) -- overrides the normal 'latest non-prerelease' lookup, needed for a prerelease-flagged upstream tag that /releases/latest would otherwise skip. Leave blank for normal behavior."
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream and publish if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XRAY_TAG: ${{ inputs.tag }}
        run: bash tools/xray/publish.sh

      - name: Regenerate README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/render-readme.sh

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: regenerate README (xray)"
          git push
